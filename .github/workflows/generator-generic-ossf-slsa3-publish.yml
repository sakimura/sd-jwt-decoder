# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Generates SLSA level 3 provenance for the built static site.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To upload the built archive to the release.
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package dist
        run: |
          # -r recurses, "." keeps .htaccess and other dotfiles in the archive
          (cd dist && zip -r ../sd-jwt-decoder-dist.zip .)

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum sd-jwt-decoder-dist.zip | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd-jwt-decoder-dist
          path: sd-jwt-decoder-dist.zip

      - name: Upload archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sd-jwt-decoder-dist.zip

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Uploads the provenance to the release
